refresh_scenes:
  name: Refresh Scenes
  description: Refresh available scenes from Govee API
  fields:
    device_id:
      name: Device ID
      description: Specific device to refresh (optional, refreshes all if omitted)
      required: false
      example: "AA:BB:CC:DD:EE:FF:00:11"
      selector:
        text:

set_segment_color:
  name: Set Segment Color
  description: Set color for specific segments on RGBIC devices
  fields:
    device_id:
      name: Device ID
      description: Device ID of the RGBIC light
      required: true
      example: "AA:BB:CC:DD:EE:FF:00:11"
      selector:
        text:
    segments:
      name: Segments
      description: List of segment indices (0-based)
      required: true
      example: "[0, 1, 2]"
      selector:
        object:
    rgb_color:
      name: RGB Color
      description: Color as [R, G, B] values (0-255)
      required: true
      example: "[255, 0, 0]"
      selector:
        color_rgb:

apply_diy_effect:
  name: Apply DIY effect
  description: >-
    Composes and uploads a DIY effect to one multi-zone lamp. Target exactly one
    device. A zone with every field empty (or mode "none") is switched off; an
    omitted field uses its fixed default, not the currently staged value.
    Requires the per-zone lights option.
  target:
    device:
      integration: govee
    entity:
      integration: govee
      domain: light
  fields:
    ripple_section:
      name: Ripple zone
      collapsed: false
      fields:
        ripple_mode:
          name: Ripple mode
          description: >-
            Effect mode for the ripple zone. Pick a name, or enter a number
            0-255. "none" - or leaving every ripple field empty - switches the
            zone off.
          required: false
          example: twinkle
          selector:
            select:
              custom_value: true
              mode: dropdown
              options:
                - none
                - gradient
                - breathe
                - rainbow
                - twinkle
                - jumping
        ripple_speed:
          name: Ripple speed
          description: Transition speed for the ripple zone. Default 50.
          required: false
          default: 50
          example: 60
          selector:
            number:
              min: 1
              max: 100
              mode: slider
        ripple_colors:
          name: Ripple colors
          description: >-
            Palette for the ripple zone as a list of [R, G, B] triplets, in the
            order the effect cycles them (1-16 colors). Required whenever the
            zone is used with a mode other than "none".
          required: false
          example: "[[255, 0, 0], [0, 176, 255]]"
          selector:
            object:
        ripple_direction:
          name: Ripple direction
          description: >-
            Motion of the ripple effect: cw, ccw, or reverse (a back-and-forth
            sweep).
          required: false
          default: cw
          example: ccw
          selector:
            select:
              mode: dropdown
              options:
                - cw
                - ccw
                - reverse
        ripple_flow_rate:
          name: Ripple flow rate
          description: Water flow rate for the ripple zone. Default 50.
          required: false
          default: 50
          example: 30
          selector:
            number:
              min: 1
              max: 100
              mode: slider
    ring_section:
      name: Ring zone
      collapsed: false
      fields:
        ring_mode:
          name: Ring mode
          description: >-
            Effect mode for the ring zone. Pick a name or type a raw number
            0-255. "none" (or omitting every ring field) switches the zone off.
          required: false
          example: gradient
          selector:
            select:
              custom_value: true
              mode: dropdown
              options:
                - none
                - gradient
                - breathe
                - twinkle
                - rainbow
                - graffiti
                - flow
                - alternate
                - gleam
                - cover
                - colorful
        ring_speed:
          name: Ring speed
          description: Transition speed for the ring zone. Default 50.
          required: false
          default: 50
          example: 40
          selector:
            number:
              min: 1
              max: 100
              mode: slider
        ring_colors:
          name: Ring colors
          description: >-
            Palette for the ring zone as a list of [R, G, B] triplets, in the
            order the effect cycles them (1-16 colors). Required whenever the
            zone is used with a mode other than "none".
          required: false
          example: "[[0, 176, 255], [255, 0, 128]]"
          selector:
            object:
