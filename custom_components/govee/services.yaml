refresh_scenes:
  fields:
    device_id:
      required: false
      example: "AA:BB:CC:DD:EE:FF:00:11"
      selector:
        device:
          integration: govee

set_segment_color:
  fields:
    device_id:
      required: true
      example: "AA:BB:CC:DD:EE:FF:00:11"
      selector:
        device:
          integration: govee
    segments:
      required: true
      example: "[0, 1, 2]"
      selector:
        object:
    rgb_color:
      required: true
      example: "[255, 0, 0]"
      selector:
        color_rgb:

apply_diy_effect:
  name: Apply DIY effect
  description: >-
    Composes and uploads a DIY effect to one multi-zone lamp. Target exactly one
    device. A zone with every field empty (or mode "none") is switched off; an
    omitted field uses its fixed default, not the currently staged value.
    Requires the per-zone lights option.
  target:
    entity:
      integration: govee
      domain: light
  fields:
    ripple_section:
      name: Ripple zone
      collapsed: false
      fields:
        ripple_mode:
          name: Ripple mode
          description: >-
            Effect mode for the ripple zone. Pick a name, or enter a number
            0-255. "none" - or leaving every ripple field empty - switches the
            zone off.
          required: false
          example: twinkle
          selector:
            select:
              custom_value: true
              mode: dropdown
              options:
                - none
                - gradient
                - breathe
                - rainbow
                - twinkle
                - jumping
        ripple_speed:
          name: Ripple speed
          description: Transition speed for the ripple zone. Default 50.
          required: false
          default: 50
          example: 60
          selector:
            number:
              min: 1
              max: 100
              mode: slider
        ripple_colors:
          name: Ripple colors
          description: >-
            Palette for the ripple zone as a list of [R, G, B] triplets, in the
            order the effect cycles them (1-16 colors). Required whenever the
            zone is used with a mode other than "none".
          required: false
          example: "[[255, 0, 0], [0, 176, 255]]"
          selector:
            object:
        ripple_direction:
          name: Ripple direction
          description: >-
            Motion of the ripple effect: cw, ccw, or reverse (a back-and-forth
            sweep).
          required: false
          default: cw
          example: ccw
          selector:
            select:
              mode: dropdown
              options:
                - cw
                - ccw
                - reverse
        ripple_flow_rate:
          name: Ripple flow rate
          description: Water flow rate for the ripple zone. Default 50.
          required: false
          default: 50
          example: 30
          selector:
            number:
              min: 1
              max: 100
              mode: slider
    ring_section:
      name: Ring zone
      collapsed: false
      fields:
        ring_mode:
          name: Ring mode
          description: >-
            Effect mode for the ring zone. Pick a name or type a raw number
            0-255. "none" (or omitting every ring field) switches the zone off.
          required: false
          example: gradient
          selector:
            select:
              custom_value: true
              mode: dropdown
              options:
                - none
                - gradient
                - breathe
                - twinkle
                - rainbow
                - graffiti
                - flow
                - alternate
                - gleam
                - cover
                - colorful
        ring_speed:
          name: Ring speed
          description: Transition speed for the ring zone. Default 50.
          required: false
          default: 50
          example: 40
          selector:
            number:
              min: 1
              max: 100
              mode: slider
        ring_colors:
          name: Ring colors
          description: >-
            Palette for the ring zone as a list of [R, G, B] triplets, in the
            order the effect cycles them (1-16 colors). Required whenever the
            zone is used with a mode other than "none".
          required: false
          example: "[[0, 176, 255], [255, 0, 128]]"
          selector:
            object:
    effect_section:
      name: Whole-light effect
      collapsed: true
      fields:
        effect:
          required: false
          example: rainbow
          selector:
            select:
              mode: dropdown
              options:
                - blend
                - bounce_1
                - bounce_2
                - bounce_3
                - breathe
                - candy_crush
                - combo
                - concentric
                - diffuse
                - diffuse_1
                - diffuse_2
                - fade_1
                - fade_2
                - fade_3
                - flame
                - flexing
                - flow
                - flow_1
                - flow_2
                - flow_3
                - flow_4
                - layered
                - marquee_1
                - marquee_2
                - marquee_3
                - mountain_peak
                - rainbow
                - rainbow_1
                - rainbow_2
                - ribbon_1
                - ribbon_2
                - rotate
                - smudge
                - spin_1
                - spin_2
                - spin_3
                - spiral
                - starlight
                - stripes_1
                - stripes_2
                - vortex
                - wave
                - whirlpool
        colors:
          required: false
          example: "[[255, 0, 0], [0, 255, 0]]"
          selector:
            object:
        speed:
          required: false
          selector:
            number:
              min: 0
              max: 100
        direction:
          required: false
          example: clockwise
          selector:
            select:
              mode: dropdown
              options:
                - up
                - down
                - clockwise
                - anticlockwise
                - upper left
                - lower left
                - upper right
                - lower right
                - expand vertically
                - gather vertically
                - gather horizontally
                - expand horizontally
                - anticlockwise upward
                - anticlockwise downward
                - clockwise upward
                - clockwise downward
        combine:
          required: false
          example: "[flow_1, breathe]"
          selector:
            select:
              multiple: true
              mode: list
              options:
                - flow_1
                - rainbow_1
                - fade_1
                - marquee_3
                - breathe
        shape:
          required: false
          example: round
          selector:
            select:
              mode: dropdown
              options:
                - round
                - square
                - rhomb
        center:
          required: false
          example: center
          selector:
            select:
              mode: dropdown
              options:
                - upper_left
                - left_center
                - bottom_left
                - top_center
                - center
                - bottom_center
                - upper_right
                - right_center
                - bottom_right

send_raw_ptreal:
  fields:
    device_id:
      required: true
      example: "AA:BB:CC:DD:EE:FF:00:11"
      selector:
        device:
          integration: govee
    frame:
      required: true
      example: "33 05 15 01 FF 00 00"
      selector:
        text:

request_status:
  fields:
    device_id:
      required: true
      example: "AA:BB:CC:DD:EE:FF:00:11"
      selector:
        device:
          integration: govee
    duration:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: s
    interval:
      required: false
      default: 5
      selector:
        number:
          min: 3
          max: 60
          unit_of_measurement: s

paint_bulbs:
  fields:
    device_id:
      required: true
      example: "AA:BB:CC:DD:EE:FF:00:11"
      selector:
        device:
          integration: govee
    colors:
      required: false
      example: '[{"rgb_color": [255, 0, 0], "bulbs": ["0-9", 20]}, {"rgb_color": [0, 255, 0], "bulbs": ["10-19"]}]'
      selector:
        object:
    base_color:
      required: false
      example: "[0, 0, 0]"
      selector:
        color_rgb:
    base_brightness:
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
