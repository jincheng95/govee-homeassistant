[tox]
envlist = py312, py313
skipsdist=True

[gh-actions]
python =
    3.12: py312
    3.13: py313

[testenv]
basepython =
    py313: python3.13
deps =
    flake8
    mypy
    -r{toxinidir}/requirements_test.txt
commands =
    flake8 .
    # Skip mypy on py313 due to HA core using PEP 696 type parameter defaults
    # that cause mypy syntax errors. Mypy check is done in separate workflow.
    py312: mypy custom_components/govee
    pytest --cov=custom_components.govee --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=95

