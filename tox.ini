[tox]
envlist = py312, py313
skipsdist=True

[gh-actions]
python =
    3.12: py312
    3.13: py313

[testenv]
basepython =
    py313: python3.13
deps =
    flake8
    mypy
    -r{toxinidir}/requirements_test.txt
commands =
    flake8 .
    # Skip mypy on py313 due to HA core using PEP 696 type parameter defaults
    # that cause mypy syntax errors. Mypy check is done in separate workflow.
    py312: mypy custom_components/govee
    pytest --cov=custom_components.govee --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=70

[flake8]
# Keep this list identical to setup.cfg's [flake8] — flake8 picks whichever
# file it finds first, so a split between the two is a lint that only fires in
# one of the two ways the project is run.
max-line-length = 119
exclude = .tox,*.egg,build/*,docs/*,*/tests/*,*/example/*,*/hacs/*
select = E,W,F
# E123/E133, E226 and E241/E242 are default ignores
# E402: module level import not at top of file
# E501: much of the tree is still wrapped at the old 88; reflowing it would be
#       a mass reformat, not a lint fix
# W503: ignore operators after line break
ignore = E123,E133,E203,E226,E241,E242,E402,E501,D202,W503,W504